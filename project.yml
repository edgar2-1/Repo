# XcodeGen spec. Generate the Xcode project with:
#
#     brew install xcodegen
#     xcodegen generate
#
# then open TVRemote.xcodeproj. Set DEVELOPMENT_TEAM below (or in Xcode's
# Signing & Capabilities tab) before building to real devices.
#
# Targets:
#   PhoneRemote  – iPhone app; embeds the watch app
#   WatchRemote  – Apple Watch app; also runs without the phone
#
# Optional: SSDP discovery of Roku/Samsung/LG needs the multicast entitlement
# (com.apple.developer.networking.multicast), which Apple grants on request.
# Without it the apps fall back to a subnet scan and manual IP entry.
name: TVRemote

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Your 10-character Apple Developer Team ID, e.g. ABCDE12345.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  TVRemoteKit:
    path: Packages/TVRemoteKit

targetTemplates:
  RemoteApp:
    type: application
    dependencies:
      - package: TVRemoteKit
        product: TVRemoteCore
      - package: TVRemoteKit
        product: GoogleTVRemote
      - package: TVRemoteKit
        product: RokuRemote
      - package: TVRemoteKit
        product: SamsungRemote
      - package: TVRemoteKit
        product: LGRemote

targets:
  PhoneRemote:
    templates: [RemoteApp]
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PhoneRemote
      - path: Shared
    dependencies:
      # Embeds the watch app so one install covers both devices.
      - target: WatchRemote
    info:
      path: PhoneRemote/Info.plist
    settings:
      base:
        PRODUCT_NAME: TV Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TVRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  WatchRemote:
    templates: [RemoteApp]
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: WatchRemote
      - path: Shared
    info:
      path: WatchRemote/Info.plist
    settings:
      base:
        PRODUCT_NAME: TV Remote
        # Must be the phone app's identifier plus ".watchkitapp" to embed.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TVRemote.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  PhoneRemote:
    build:
      targets:
        PhoneRemote: all
    run:
      config: Debug
  WatchRemote:
    build:
      targets:
        WatchRemote: all
    run:
      config: Debug
