# XcodeGen spec. Generate the Xcode project with:
#
#     brew install xcodegen
#     xcodegen generate
#
# then open GoogleTVWatchRemote.xcodeproj.
#
# Optional: SSDP discovery of Roku/Samsung/LG needs the multicast entitlement
# (com.apple.developer.networking.multicast), which Apple grants on request.
# Without it the app falls back to a subnet scan and manual IP entry. Set DEVELOPMENT_TEAM below (or in
# Xcode's Signing & Capabilities tab) before building to a real watch.
name: GoogleTVWatchRemote

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "9.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Your 10-character Apple Developer Team ID, e.g. ABCDE12345.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TVRemoteKit:
    path: Packages/TVRemoteKit

targets:
  WatchRemote:
    # Single-target watchOS app (Xcode 14+ format); no iPhone companion app.
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: WatchRemote
    dependencies:
      - package: TVRemoteKit
        product: TVRemoteCore
      - package: TVRemoteKit
        product: GoogleTVRemote
      - package: TVRemoteKit
        product: RokuRemote
      - package: TVRemoteKit
        product: SamsungRemote
      - package: TVRemoteKit
        product: LGRemote
    info:
      path: WatchRemote/Info.plist
    settings:
      base:
        PRODUCT_NAME: TV Remote
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GoogleTVWatchRemote
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      configVariants: []
