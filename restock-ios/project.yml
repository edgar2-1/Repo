# XcodeGen spec. Generate the Xcode project with:
#
#     brew install xcodegen
#     xcodegen generate
#
# then open Restock.xcodeproj. Set DEVELOPMENT_TEAM below (or in Xcode's
# Signing & Capabilities tab) and change the bundle id before building to a
# real device or uploading to App Store Connect.
name: Restock

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Your 10-character Apple Developer Team ID, e.g. ABCDE12345.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  RestockKit:
    path: Packages/RestockKit

targets:
  Restock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Restock
    dependencies:
      - package: RestockKit
        product: RestockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Restock
    info:
      path: Restock/Info.plist
      properties:
        CFBundleDisplayName: Restock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Restock uses the camera to scan receipts and product barcodes. Images are read on your iPhone and never uploaded.
        ITSAppUsesNonExemptEncryption: false

schemes:
  Restock:
    build:
      targets:
        Restock: all
    run:
      config: Debug
    archive:
      config: Release
