name: Restock iOS

on:
  push:
    paths: ["restock-ios/**", ".github/workflows/restock-ios.yml"]
  pull_request:
    paths: ["restock-ios/**", ".github/workflows/restock-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: restock-ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test RestockKit
        run: swift test --package-path Packages/RestockKit
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Restock.xcodeproj -scheme Restock \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
